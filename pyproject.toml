[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contextguard"
version = "0.1.0"
description = "Privacy-preserving, context-aware intrusion reasoning and grounded natural-language security intelligence for a laptop webcam."
requires-python = ">=3.10"
dependencies = [
    "opencv-python>=4.10",
    "ultralytics>=8.3",
    # ByteTrack's linear-assignment solver. Pinned explicitly rather than
    # left to Ultralytics' runtime auto-install (which works, but means
    # the first `.track()` call silently pip-installs a package mid-run
    # -- surprising behavior for a production deployment, and one that
    # fails outright with no network egress at runtime).
    "lap>=0.5.12",
    "streamlit>=1.60",
    "streamlit-drawable-canvas>=0.9.3",
    "Pillow>=10.0",
    "pandas>=2.2",
    "psutil>=6.0",
    "dateparser>=1.2",
    "PyYAML>=6.0",
    "scikit-learn>=1.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]
# The machine-integration REST API (api/) -- optional because the
# Streamlit dashboard alone covers the single-user local case with zero
# extra dependencies. Pull this in for headless/server deployments or
# integrating ContextGuard's events into another system.
api = ["fastapi>=0.110", "uvicorn[standard]>=0.30", "slowapi>=0.1.9", "prometheus-client>=0.20"]
# The small local-LM narrator comparison (contextguard/nlp/local_llm.py)
# -- optional because it pulls in `transformers` and downloads a model on
# first use; the default template narrator needs neither.
localllm = ["transformers>=4.45", "accelerate>=0.30"]

[tool.setuptools.packages.find]
include = ["contextguard*"]

# ultralytics pulls in torch, and torch's default PyPI wheel bundles the
# full CUDA/cuDNN/NCCL stack (several GB) even on a machine with no GPU --
# exactly what this project explicitly doesn't need (CPU-only laptop
# deployment is a hard requirement, not an afterthought). Pin torch to
# PyTorch's dedicated CPU-only wheel index so `uv sync` / `uv pip install`
# fetch the small (~200 MB) CPU build instead. Plain `pip install` doesn't
# read this table -- see the CPU-only pip instructions in the README.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
