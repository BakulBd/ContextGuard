name: Feature request
description: Suggest an improvement or new capability
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What are you trying to do that ContextGuard makes hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see? Rough sketches and API shapes welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: constraints
    attributes:
      label: Fit with project constraints
      description: ContextGuard is deliberately narrow. Please confirm your idea respects these.
      options:
        - label: It does not add a cloud/remote inference call to the default path.
          required: true
        - label: It does not weaken the privacy defaults (anonymous tracking, no stored thumbnails, enforced retention).
          required: true
        - label: It keeps working on CPU with no discrete GPU.
          required: true
